BadRequest:
  description: Bad Request - The request is invalid or missing required parameters
  content:
    application/json:
      schema:
        $ref: '../schemas/_common.yaml#/ErrorResponse'

Unauthorized:
  description: Unauthorized - JWT token is missing, invalid, or expired
  content:
    application/json:
      schema:
        $ref: '../schemas/_common.yaml#/ErrorResponse'

Forbidden:
  description: Forbidden - You don't have permission to access this resource
  content:
    application/json:
      schema:
        $ref: '../schemas/_common.yaml#/ErrorResponse'

NotFound:
  description: Not Found - The requested resource does not exist
  content:
    application/json:
      schema:
        $ref: '../schemas/_common.yaml#/ErrorResponse'

InternalServerError:
  description: Internal Server Error - An unexpected error occurred
  content:
    application/json:
      schema:
        $ref: '../schemas/_common.yaml#/ErrorResponse'