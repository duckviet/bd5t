page:
  name: page
  in: query
  schema:
    type: integer
    default: 1
    minimum: 1
  description: Page number for pagination

pageSize:
  name: pageSize
  in: query
  schema:
    type: integer
    default: 20
    minimum: 1
    maximum: 100
  description: Number of items per page

unitId:
  name: unitId
  in: query
  schema:
    type: string
    format: uuid
  description: Filter by unit/organization ID

activityId:
  name: activityId
  in: query
  schema:
    type: string
    format: uuid
  description: Filter by activity ID

evidenceStatus:
  name: status
  in: query
  schema:
    type: string
    enum: [pending, approved, rejected]
  description: Filter by evidence status

slug:
  name: slug
  in: path
  required: true
  schema:
    type: string
  description: URL-friendly identifier for the resource

studentId:
  name: studentId
  in: path
  required: true
  schema:
    type: string
  description: Student ID used in leaderboard detail routes

uuid:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
  description: Unique identifier of the resource
