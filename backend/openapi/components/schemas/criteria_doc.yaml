CriteriaDoc:
  type: object
  properties:
    id:
      type: string
      format: uuid
    criteriaType:
      type: string
      enum: [DAO_DUC, HOC_TAP, THE_LUC, TINH_NGUYEN, HOI_NHAP]
      example: "DAO_DUC"
    title:
      type: string
      example: "Tham gia đầy đủ các buổi sinh hoạt"
    description:
      type: string
      example: "Sinh viên phải tham gia ít nhất 80% số buổi sinh hoạt"
    maxScore:
      type: integer
      example: 100