ProgressMatrix:
  type: object
  properties:
    userId:
      type: string
      format: uuid
    activities:
      type: array
      items:
        $ref: "#/ProgressMatrixCell"
    criteriaScores:
      type: array
      items:
        $ref: "#/ProgressCriteriaScore"

ProgressCriteriaScore:
  type: object
  properties:
    criteria:
      type: string
      enum: [DAO_DUC, HOC_TAP, THE_LUC, TINH_NGUYEN, HOI_NHAP]
      example: "DAO_DUC"
    label:
      type: string
      example: "Đạo đức tốt"
    score:
      type: integer
      description: Total score for the criterion after participation and award points
      example: 150
    maxScore:
      type: integer
      example: 200
    participationScore:
      type: integer
      description: Score from approved participation count
      example: 50
    awardScore:
      type: integer
      description: Score from the highest award level within the criterion
      example: 100
    approvedActivityCount:
      type: integer
      description: Number of approved activities counted for this criterion
      example: 2
    awardLevel:
      type: string
      enum: [NONE, KHUYEN_KHICH, BA, NHI, NHAT]
      example: "NHAT"

ProgressMatrixCell:
  type: object
  properties:
    activityId:
      type: string
      format: uuid
    activityTitle:
      type: string
      example: "Tập hợp trường 2025"
    totalScore:
      type: integer
      description: Sum of all approved evidence scores
      example: 80
    completedCriteria:
      type: array
      description: List of criteria that have been approved
      items:
        type: object
        properties:
          criteriaDocId:
            type: string
            format: uuid
          criteriaType:
            type: string
            enum: [DAO_DUC, HOC_TAP, THE_LUC, TINH_NGUYEN, HOI_NHAP]
            example: "TINH_NGUYEN"
          criteriaDocTitle:
            type: string
            example: "Tham gia đầy đủ các buổi sinh hoạt"
          score:
            type: integer
            example: 100
          evidenceCount:
            type: integer
            description: Number of approved evidence items
            example: 2
