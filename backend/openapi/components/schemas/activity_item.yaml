ActivityItem:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
      example: "tap-hop-truong-2025"
    title:
      type: string
      example: "Tập hợp trường 2025"
    shortDescription:
      type: string
      example: "Hoạt động tập hợp toàn trường"
    location:
      type: [string, "null"]
    targetAudience:
      type: [string, "null"]
    rules:
      type: [string, "null"]
    rewards:
      type: [string, "null"]
    contactInfo:
      type: [string, "null"]
    thumbnailUrl:
      type: string
      format: uri
      example: "https://cdn.example.com/activities/tap-hop-2025.jpg"
    unitId:
      type: [string, "null"]
      format: uuid
    unitName:
      type: [string, "null"]
      example: "Khoa Công nghệ Thông tin"
    startDate:
      type: string
      format: date
      example: "2025-03-01"
    endDate:
      type: string
      format: date
      example: "2025-03-31"
    isActive:
      type: boolean
      example: true
    registrationUrl:
      type: [string, "null"]
      format: uri
      example: "https://example.com/register"
    reviewLevel:
      type: string
      enum: [TRUONG, DHQGHN, THANH_PHO, TRUNG_UONG]
      example: "TRUONG"
    criteria:
      type: array
      items:
        type: string
        enum: [DAO_DUC, HOC_TAP, THE_LUC, TINH_NGUYEN, HOI_NHAP]
      example: ["DAO_DUC", "HOC_TAP"]
    organizer:
      type: [string, "null"]
      example: "Ban Công tác Sinh viên"
    participantCount:
      type: integer
      description: Number of distinct students with submitted evidence for this activity
      example: 24
    evidenceCount:
      type: integer
      description: Total submitted evidences for this activity
      example: 32
    pendingEvidenceCount:
      type: integer
      description: Number of pending evidences for this activity
      example: 6
    totalScore:
      type: integer
      description: Sum of configured activity criteria scores
      example: 100
    createdByName:
      type: [string, "null"]
      description: Admin creator display name when available
      example: "Admin Hội Sinh viên"
