ActivityItem:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
      example: "tap-hop-truong-2025"
    title:
      type: string
      example: "Tập hợp trường 2025"
    shortDescription:
      type: string
      example: "Hoạt động tập hợp toàn trường"
    location:
      type: string
      nullable: true
    targetAudience:
      type: string
      nullable: true
    rules:
      type: string
      nullable: true
    rewards:
      type: string
      nullable: true
    contactInfo:
      type: string
      nullable: true
    thumbnailUrl:
      type: string
      format: uri
      example: "https://cdn.example.com/activities/tap-hop-2025.jpg"
    unitId:
      type: string
      format: uuid
      nullable: true
    unitName:
      type: string
      nullable: true
      example: "Khoa Công nghệ Thông tin"
    startDate:
      type: string
      format: date
      example: "2025-03-01"
    endDate:
      type: string
      format: date
      example: "2025-03-31"
    isActive:
      type: boolean
      example: true