ActivityDetail:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
      example: "tap-hop-truong-2025"
    title:
      type: string
      example: "Tập hợp trường 2025"
    description:
      type: string
      example: "Hoạt động tập hợp toàn trường lần thứ 5..."
    shortDescription:
      type: string
      example: "Hoạt động tập hợp toàn trường"
    location:
      type: [string, "null"]
    targetAudience:
      type: [string, "null"]
    rules:
      type: [string, "null"]
    rewards:
      type: [string, "null"]
    contactInfo:
      type: [string, "null"]
    thumbnailUrl:
      type: string
      format: uri
      example: "https://cdn.example.com/activities/tap-hop-2025.jpg"
    unitId:
      type: [string, "null"]
      format: uuid
    unitName:
      type: [string, "null"]
      example: "Khoa Công nghệ Thông tin"
    startDate:
      type: string
      format: date
      example: "2025-03-01"
    endDate:
      type: string
      format: date
      example: "2025-03-31"
    isActive:
      type: boolean
      example: true
    registrationUrl:
      type: [string, "null"]
      format: uri
      example: "https://forms.example.com/register"
    reviewLevel:
      type: string
      enum: [TRUONG, DHQGHN, THANH_PHO, TRUNG_UONG]
      example: "TRUONG"
    organizer:
      type: [string, "null"]
      example: "Ban Công tác Sinh viên"
    criteriaDocs:
      type: array
      items:
        $ref: './criteria_doc.yaml#/CriteriaDoc'

CreateActivityRequest:
  type: object
  required:
    - title
    - slug
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 255
    description:
      type: [string, "null"]
    slug:
      type: string
      pattern: '^[a-z0-9-]+$'
      description: URL-friendly slug, must be unique
    thumbnailUrl:
      type: [string, "null"]
      format: uri
    shortDescription:
      type: [string, "null"]
    location:
      type: [string, "null"]
    targetAudience:
      type: [string, "null"]
    rules:
      type: [string, "null"]
    rewards:
      type: [string, "null"]
    contactInfo:
      type: [string, "null"]
    unitId:
      type: [string, "null"]
      format: uuid
    startDate:
      type: [string, "null"]
      format: date
    endDate:
      type: [string, "null"]
      format: date
    isActive:
      type: boolean
      default: true
    registrationUrl:
      type: [string, "null"]
      format: uri
    reviewLevel:
      type: [string, "null"]
      enum: [TRUONG, DHQGHN, THANH_PHO, TRUNG_UONG]
    organizer:
      type: [string, "null"]

UpdateActivityRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 255
    description:
      type: [string, "null"]
    slug:
      type: string
      pattern: '^[a-z0-9-]+$'
    thumbnailUrl:
      type: [string, "null"]
      format: uri
    shortDescription:
      type: [string, "null"]
    location:
      type: [string, "null"]
    targetAudience:
      type: [string, "null"]
    rules:
      type: [string, "null"]
    rewards:
      type: [string, "null"]
    contactInfo:
      type: [string, "null"]
    unitId:
      type: [string, "null"]
      format: uuid
    startDate:
      type: [string, "null"]
      format: date
    endDate:
      type: [string, "null"]
      format: date
    isActive:
      type: boolean
    registrationUrl:
      type: [string, "null"]
      format: uri
    reviewLevel:
      type: [string, "null"]
      enum: [TRUONG, DHQGHN, THANH_PHO, TRUNG_UONG]
    organizer:
      type: [string, "null"]