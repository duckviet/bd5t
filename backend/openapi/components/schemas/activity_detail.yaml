ActivityDetail:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
      example: "tap-hop-truong-2025"
    title:
      type: string
      example: "Tập hợp trường 2025"
    description:
      type: string
      example: "Hoạt động tập hợp toàn trường lần thứ 5..."
    shortDescription:
      type: string
      example: "Hoạt động tập hợp toàn trường"
    location:
      type: string
      nullable: true
    targetAudience:
      type: string
      nullable: true
    rules:
      type: string
      nullable: true
    rewards:
      type: string
      nullable: true
    contactInfo:
      type: string
      nullable: true
    thumbnailUrl:
      type: string
      format: uri
      example: "https://cdn.example.com/activities/tap-hop-2025.jpg"
    unitId:
      type: string
      format: uuid
      nullable: true
    unitName:
      type: string
      nullable: true
      example: "Khoa Công nghệ Thông tin"
    startDate:
      type: string
      format: date
      example: "2025-03-01"
    endDate:
      type: string
      format: date
      example: "2025-03-31"
    isActive:
      type: boolean
      example: true
    registrationUrl:
      type: string
      format: uri
      nullable: true
      example: "https://forms.example.com/register"
    reviewLevel:
      type: string
      enum: [TRUONG, DHQGHN, THANH_PHO, TRUNG_UONG]
      example: "TRUONG"
    organizer:
      type: string
      nullable: true
      example: "Ban Công tác Sinh viên"
    criteriaDocs:
      type: array
      items:
        $ref: './criteria_doc.yaml#/CriteriaDoc'

CreateActivityRequest:
  type: object
  required:
    - title
    - slug
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 255
    description:
      type: string
      nullable: true
    slug:
      type: string
      pattern: '^[a-z0-9-]+$'
      description: URL-friendly slug, must be unique
    thumbnailUrl:
      type: string
      format: uri
      nullable: true
    shortDescription:
      type: string
      nullable: true
    location:
      type: string
      nullable: true
    targetAudience:
      type: string
      nullable: true
    rules:
      type: string
      nullable: true
    rewards:
      type: string
      nullable: true
    contactInfo:
      type: string
      nullable: true
    unitId:
      type: string
      format: uuid
      nullable: true
    startDate:
      type: string
      format: date
      nullable: true
    endDate:
      type: string
      format: date
      nullable: true
    isActive:
      type: boolean
      default: true
    registrationUrl:
      type: string
      format: uri
      nullable: true
    reviewLevel:
      type: string
      enum: [TRUONG, DHQGHN, THANH_PHO, TRUNG_UONG]
      nullable: true
    organizer:
      type: string
      nullable: true

UpdateActivityRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 255
    description:
      type: string
      nullable: true
    slug:
      type: string
      pattern: '^[a-z0-9-]+$'
    thumbnailUrl:
      type: string
      format: uri
      nullable: true
    shortDescription:
      type: string
      nullable: true
    location:
      type: string
      nullable: true
    targetAudience:
      type: string
      nullable: true
    rules:
      type: string
      nullable: true
    rewards:
      type: string
      nullable: true
    contactInfo:
      type: string
      nullable: true
    unitId:
      type: string
      format: uuid
      nullable: true
    startDate:
      type: string
      format: date
      nullable: true
    endDate:
      type: string
      format: date
      nullable: true
    isActive:
      type: boolean
    registrationUrl:
      type: string
      format: uri
      nullable: true
    reviewLevel:
      type: string
      enum: [TRUONG, DHQGHN, THANH_PHO, TRUNG_UONG]
      nullable: true
    organizer:
      type: string
      nullable: true