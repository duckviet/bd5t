PaginationMeta:
  type: object
  properties:
    page:
      type: integer
      description: Current page number
      example: 1
    pageSize:
      type: integer
      description: Number of items per page
      example: 20
    total:
      type: integer
      description: Total number of items
      example: 100
    totalPages:
      type: integer
      description: Total number of pages
      example: 5

ApiResponse:
  type: object
  properties:
    success:
      type: boolean
      description: Indicates if the request was successful
      example: true
    data:
      type: [object, "null"]
      description: Response data payload

ApiResponseList:
  type: object
  properties:
    success:
      type: boolean
      description: Indicates if the request was successful
      example: true
    data:
      type: array
      items:
        type: object
      description: Array of response data items
    meta:
      $ref: '#/PaginationMeta'

ErrorResponse:
  type: object
  properties:
    success:
      type: boolean
      description: Always false for errors
      example: false
    error:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: UNAUTHORIZED
        message:
          type: string
          description: Human-readable error message
          example: Authentication token is required
        details:
          type: [object, "null"]
          description: Additional error details (optional)