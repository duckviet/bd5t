LeaderboardItem:
  type: object
  properties:
    rank:
      type: integer
      description: Current rank position
      example: 1
    userId:
      type: string
      format: uuid
    studentId:
      type: string
      example: "22040001"
    userName:
      type: string
      description: Display name of the user
      example: "Nguyễn Văn A"
    unitId:
      type: [string, "null"]
      format: uuid
    unitName:
      type: [string, "null"]
      example: "Khoa Công nghệ Thông tin"
    totalApproved:
      type: integer
      description: Number of approved evidence submissions
      example: 15
    totalScore:
      type: integer
      description: Sum of all approved scores
      example: 1250
    highestAwardLevel:
      type: [string, "null"]
      enum: [NONE, KHUYEN_KHICH, BA, NHI, NHAT]
      description: Highest award level achieved by the student across all approved evidences

LeaderboardCriteriaStat:
  type: object
  properties:
    criteria:
      type: string
      enum: [DAO_DUC, HOC_TAP, THE_LUC, TINH_NGUYEN, HOI_NHAP]
      example: "DAO_DUC"
    label:
      type: string
      example: "Đạo đức tốt"
    approvedActivities:
      type: integer
      description: Number of approved activities/evidences counted for this criterion
      example: 3
    score:
      type: integer
      description: Total score for the criterion after participation and award points
      example: 150
    maxScore:
      type: integer
      example: 200
    participationScore:
      type: integer
      description: Score from approved participation count
      example: 50
    awardScore:
      type: integer
      description: Score from the highest award level within the criterion
      example: 100
    awardLevel:
      type: string
      enum: [NONE, KHUYEN_KHICH, BA, NHI, NHAT]
      example: "NHAT"
  required:
    - criteria
    - label
    - approvedActivities

LeaderboardDetail:
  type: object
  properties:
    rank:
      type: integer
      description: Current rank position
      example: 1
    userId:
      type: string
      format: uuid
    studentId:
      type: string
      example: "22040001"
    userName:
      type: string
      description: Display name of the user
      example: "Nguyễn Văn A"
    unitId:
      type: [string, "null"]
      format: uuid
    unitName:
      type: [string, "null"]
      example: "Khoa Công nghệ Thông tin"
    className:
      type: [string, "null"]
      example: "K56A1"
    totalApproved:
      type: integer
      description: Number of approved activity submissions
      example: 15
    totalScore:
      type: integer
      description: Sum of all approved scores
      example: 1250
    criteriaStats:
      type: array
      items:
        $ref: '#/LeaderboardCriteriaStat'
    awards:
      type: array
      items:
        $ref: '#/LeaderboardAward'
  required:
    - rank
    - userId
    - studentId
    - userName
    - totalApproved
    - totalScore
    - criteriaStats
    - awards

LeaderboardAward:
  type: object
  properties:
    activityTitle:
      type: string
      example: "Olympic Tin học sinh viên"
    reviewLevel:
      type: [string, "null"]
      enum: [TRUONG, DHQGHN, THANH_PHO, TRUNG_UONG]
      example: "TRUONG"
    awardLevel:
      type: string
      enum: [NONE, KHUYEN_KHICH, BA, NHI, NHAT]
      example: "NHAT"
  required:
    - activityTitle
    - awardLevel
