post:
  summary: Login user
  operationId: login
  tags:
    - Auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/user.yaml#/LoginRequest'
  responses:
    '200':
      description: Login successful
      headers:
        Set-Cookie:
          schema:
            type: string
          description: HTTP-only cookies for access and refresh tokens
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/_common.yaml#/ApiResponse'
              - type: object
                properties:
                  data:
                    $ref: '../../components/schemas/user.yaml#/AuthResponse'
    '401':
      $ref: '../../components/responses/error_responses.yaml#/Unauthorized'