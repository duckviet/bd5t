post:
  summary: Logout user
  operationId: logout
  tags:
    - Auth
  security:
    - bearerAuth: []
    - cookieAuth: []
  responses:
    '200':
      description: Logout successful
      headers:
        Set-Cookie:
          schema:
            type: string
          description: Clear authentication cookies
    '401':
      $ref: '../../components/responses/error_responses.yaml#/Unauthorized'