post:
  summary: Register a new user
  operationId: register
  tags:
    - Auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/user.yaml#/RegisterRequest'
  responses:
    '201':
      description: User registered successfully
      headers:
        Set-Cookie:
          schema:
            type: string
          description: HTTP-only cookies for access and refresh tokens
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/_common.yaml#/ApiResponse'
              - type: object
                properties:
                  data:
                    $ref: '../../components/schemas/user.yaml#/AuthResponse'
    '400':
      $ref: '../../components/responses/error_responses.yaml#/BadRequest'
    '409':
      description: User with this email or studentId already exists
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/_common.yaml#/ErrorResponse'