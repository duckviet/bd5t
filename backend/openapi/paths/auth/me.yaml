get:
  summary: Get current user
  operationId: me
  tags:
    - Auth
  security:
    - bearerAuth: []
    - cookieAuth: []
  responses:
    '200':
      description: Current user profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'