get:
  summary: Get current user
  operationId: me
  tags:
    - Auth
  security:
    - bearerAuth: []
    - cookieAuth: []
  responses:
    '200':
      description: Current user profile
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/_common.yaml#/ApiResponse'
              - type: object
                properties:
                  data:
                    $ref: '../../components/schemas/user.yaml#/UserProfile'
    '401':
      $ref: '../../components/responses/error_responses.yaml#/Unauthorized'