post:
  summary: Refresh access token
  operationId: refresh
  tags:
    - Auth
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/user.yaml#/RefreshRequest'
  responses:
    '200':
      description: Token refreshed successfully
      headers:
        Set-Cookie:
          schema:
            type: string
          description: New access token cookie
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/_common.yaml#/ApiResponse'
              - type: object
                properties:
                  data:
                    $ref: '../../components/schemas/user.yaml#/TokenResponse'
    '401':
      $ref: '../../components/responses/error_responses.yaml#/Unauthorized'