patch:
  summary: Review an evidence submission
  description: Admin reviews evidence. Can approve or reject. By default, only pending evidence can be reviewed unless forceOverride is true.
  operationId: reviewEvidence
  tags:
    - Admin
  security:
    - bearerAuth: []
    - cookieAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Evidence ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ReviewEvidenceRequest'
  responses:
    '200':
      description: Evidence reviewed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/EvidenceItem'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: Evidence already reviewed and forceOverride not set
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '500':
      $ref: '#/components/responses/InternalServerError'