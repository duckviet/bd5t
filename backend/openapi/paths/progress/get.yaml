get:
  summary: Get current user progress matrix
  operationId: getProgress
  tags:
    - Progress
  security:
    - bearerAuth: []
    - cookieAuth: []
  responses:
    '200':
      description: User progress matrix
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/ProgressMatrix'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '500':
      $ref: '#/components/responses/InternalServerError'