get:
  summary: List notifications for current user
  operationId: listNotifications
  tags:
    - Notifications
  security:
    - bearerAuth: []
    - cookieAuth: []
  parameters:
    - $ref: '../components/parameters/_index.yaml#/page'
    - $ref: '../components/parameters/_index.yaml#/pageSize'
  responses:
    '200':
      description: List of notifications
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/_common.yaml#/ApiResponseList'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/schemas/notification.yaml#/NotificationItem'
    '401':
      $ref: '../components/responses/error_responses.yaml#/Unauthorized'
    '500':
      $ref: '../components/responses/error_responses.yaml#/InternalServerError'

