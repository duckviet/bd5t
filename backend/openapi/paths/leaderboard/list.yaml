get:
  summary: Get leaderboard
  operationId: listLeaderboard
  tags:
    - Leaderboard
  parameters:
    - name: page
      in: query
      schema:
        type: integer
        default: 1
    - name: pageSize
      in: query
      schema:
        type: integer
        default: 20
    - name: unitId
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by unit ID
  responses:
    '200':
      description: Leaderboard list
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardItem'
              meta:
                $ref: '#/components/schemas/PaginationMeta'
    '500':
      $ref: '#/components/responses/InternalServerError'