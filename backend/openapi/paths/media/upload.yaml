post:
  summary: Upload media file
  operationId: uploadMedia
  tags:
    - Media
  security:
    - bearerAuth: []
    - cookieAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              format: binary
            type:
              type: string
              enum: [avatar, thumbnail, evidence]
              description: Type of media upload
          required:
            - file
            - type
  responses:
    '200':
      description: File uploaded successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/_common.yaml#/ApiResponse'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                      key:
                        type: string
    '400':
      $ref: '../../components/responses/error_responses.yaml#/BadRequest'
    '401':
      $ref: '../../components/responses/error_responses.yaml#/Unauthorized'
    '413':
      description: File too large - exceeds maximum allowed size
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/_common.yaml#/ErrorResponse'
    '500':
      $ref: '../../components/responses/error_responses.yaml#/InternalServerError'