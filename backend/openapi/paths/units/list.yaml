get:
  summary: List all units
  description: Get a list of all organizational units (faculties/departments)
  operationId: listUnits
  tags:
    - Units
  responses:
    '200':
      description: List of units
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../components/schemas/_common.yaml#/ApiResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas/unit_item.yaml#/UnitItem'
    '500':
      $ref: '../../components/responses/error_responses.yaml#/InternalServerError'