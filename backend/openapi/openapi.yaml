openapi: 3.1.0
info:
  title: Ban Do 5 Tot API
  description: Backend API for Ban Do 5 Tot project
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.bando5tot.edu.vn
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token in Authorization header
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT access token in HTTP-only cookie

  parameters:
    page:
      $ref: "./components/parameters/_index.yaml#/page"
    pageSize:
      $ref: "./components/parameters/_index.yaml#/pageSize"
    unitId:
      $ref: "./components/parameters/_index.yaml#/unitId"
    activityId:
      $ref: "./components/parameters/_index.yaml#/activityId"
    evidenceStatus:
      $ref: "./components/parameters/_index.yaml#/evidenceStatus"
    slug:
      $ref: "./components/parameters/_index.yaml#/slug"
    uuid:
      $ref: "./components/parameters/_index.yaml#/uuid"

  responses:
    BadRequest:
      $ref: "./components/responses/error_responses.yaml#/BadRequest"
    Unauthorized:
      $ref: "./components/responses/error_responses.yaml#/Unauthorized"
    Forbidden:
      $ref: "./components/responses/error_responses.yaml#/Forbidden"
    NotFound:
      $ref: "./components/responses/error_responses.yaml#/NotFound"
    InternalServerError:
      $ref: "./components/responses/error_responses.yaml#/InternalServerError"

  schemas:
    PaginationMeta:
      $ref: "./components/schemas/_common.yaml#/PaginationMeta"
    ApiResponse:
      $ref: "./components/schemas/_common.yaml#/ApiResponse"
    ApiResponseList:
      $ref: "./components/schemas/_common.yaml#/ApiResponseList"
    ErrorResponse:
      $ref: "./components/schemas/_common.yaml#/ErrorResponse"
    UserProfile:
      $ref: "./components/schemas/user.yaml#/UserProfile"
    RegisterRequest:
      $ref: "./components/schemas/user.yaml#/RegisterRequest"
    LoginRequest:
      $ref: "./components/schemas/user.yaml#/LoginRequest"
    RefreshRequest:
      $ref: "./components/schemas/user.yaml#/RefreshRequest"
    AuthResponse:
      $ref: "./components/schemas/user.yaml#/AuthResponse"
    TokenResponse:
      $ref: "./components/schemas/user.yaml#/TokenResponse"
    UpdateProfileRequest:
      $ref: "./components/schemas/user.yaml#/UpdateProfileRequest"
    UnitItem:
      $ref: "./components/schemas/unit_item.yaml#/UnitItem"
    ActivityItem:
      $ref: "./components/schemas/activity_item.yaml#/ActivityItem"
    ActivityDetail:
      $ref: "./components/schemas/activity_detail.yaml#/ActivityDetail"
    CreateActivityRequest:
      $ref: "./components/schemas/activity_detail.yaml#/CreateActivityRequest"
    UpdateActivityRequest:
      $ref: "./components/schemas/activity_detail.yaml#/UpdateActivityRequest"
    CriteriaDoc:
      $ref: "./components/schemas/criteria_doc.yaml#/CriteriaDoc"
    EvidenceItem:
      $ref: "./components/schemas/evidence.yaml#/EvidenceItem"
    CreateEvidenceRequest:
      $ref: "./components/schemas/evidence.yaml#/CreateEvidenceRequest"
    ReviewEvidenceRequest:
      $ref: "./components/schemas/evidence.yaml#/ReviewEvidenceRequest"
    BulkReviewEvidenceRequest:
      $ref: "./components/schemas/evidence.yaml#/BulkReviewEvidenceRequest"
    AdminEvidenceStats:
      $ref: "./components/schemas/evidence.yaml#/AdminEvidenceStats"
    ProgressMatrix:
      $ref: "./components/schemas/progress.yaml#/ProgressMatrix"
    ProgressMatrixCell:
      $ref: "./components/schemas/progress.yaml#/ProgressMatrixCell"
    LeaderboardItem:
      $ref: "./components/schemas/leaderboard.yaml#/LeaderboardItem"
    NotificationItem:
      $ref: "./components/schemas/notification.yaml#/NotificationItem"
    MarkAllNotificationsReadResult:
      $ref: "./components/schemas/notification.yaml#/MarkAllNotificationsReadResult"

paths:
  /healthz:
    $ref: "./paths/health/health.yaml#/~1healthz"
  /readyz:
    $ref: "./paths/health/health.yaml#/~1readyz"
  /auth/register:
    $ref: "./paths/auth/register.yaml"
  /auth/login:
    $ref: "./paths/auth/login.yaml"
  /auth/logout:
    $ref: "./paths/auth/logout.yaml"
  /auth/me:
    $ref: "./paths/auth/me.yaml"
  /auth/refresh:
    $ref: "./paths/auth/refresh.yaml"
  /units:
    $ref: "./paths/units/list.yaml"
  /activities:
    $ref: "./paths/activities/list.yaml"
  /activities/{slug}:
    $ref: "./paths/activities/detail.yaml"
  /profile:
    $ref: "./paths/profile.yaml"
  /media/upload:
    $ref: "./paths/media/upload.yaml"
  /evidences:
    $ref: "./paths/evidences.yaml"
  /evidences/{id}:
    $ref: "./paths/evidences/delete.yaml"
  /progress:
    $ref: "./paths/progress/get.yaml"
  /leaderboard:
    $ref: "./paths/leaderboard/list.yaml"
  /notifications:
    $ref: "./paths/notifications.yaml"
  /notifications/{id}/read:
    $ref: "./paths/notifications/read.yaml"
  /notifications/read-all:
    $ref: "./paths/notifications/read-all.yaml"
  /admin/activities:
    $ref: "./paths/admin/create-activity.yaml"
  "/admin/activities/{id}":
    $ref: "./paths/admin/activity_detail.yaml"
  /admin/evidences:
    $ref: "./paths/admin/evidences.yaml"
  /admin/evidences/stats:
    $ref: "./paths/admin/evidence-stats.yaml"
  /admin/evidences/review-bulk:
    $ref: "./paths/admin/review-evidences-bulk.yaml"
  /admin/evidences/{id}/review:
    $ref: "./paths/admin/review-evidence.yaml"
