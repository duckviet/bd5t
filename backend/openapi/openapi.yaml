openapi: 3.0.3
info:
  title: Ban Do 5 Tot API
  description: Backend API for Ban Do 5 Tot project
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  responses:
    BadRequest:
      description: "Bad Request. The request is invalid."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid request."
    Unauthorized:
      description: "Unauthorized. The provided JWT token is missing, invalid, or expired."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Authentication token is required."
    Forbidden:
      description: "Forbidden - You don't have permission to access this resource"
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Forbidden"
    NotFound:
      description: "Not Found. The requested resource was not found."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Resource not found."
    InternalServerError:
      description: "Internal Server Error. The server encountered an unexpected condition."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Internal server error."

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - studentId
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        studentId:
          type: string
        displayName:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        accessToken:
          type: string
        refreshToken:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        studentId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        role:
          type: string
          enum: [student, admin]
          default: student
        createdAt:
          type: string
          format: date-time

    UnitItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        description:
          type: string

    ActivityItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        shortDescription:
          type: string
        thumbnailUrl:
          type: string
          format: uri
        unitId:
          type: string
          format: uuid
          nullable: true
        unitName:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isActive:
          type: boolean

    CriteriaDoc:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        maxScore:
          type: integer

    ActivityDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        thumbnailUrl:
          type: string
          format: uri
        unitId:
          type: string
          format: uuid
          nullable: true
        unitName:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isActive:
          type: boolean
        registrationUrl:
          type: string
          format: uri
          nullable: true
        reviewLevel:
          type: string
          enum: [TRUONG, DHQGHN, THANH_PHO, TRUNG_UONG]
        organizer:
          type: string
          nullable: true
        criteriaDocs:
          type: array
          items:
            $ref: '#/components/schemas/CriteriaDoc'

paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: healthz
      tags:
        - Health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      summary: Readiness check
      operationId: readyz
      tags:
        - Health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: Service unavailable

  /auth/register:
    post:
      summary: Register a new user
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Login user
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      summary: Logout user
      operationId: logout
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      summary: Get current user
      operationId: me
      tags:
        - Auth
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      summary: Refresh access token
      operationId: refresh
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /units:
    get:
      summary: List all units
      operationId: listUnits
      tags:
        - Units
      responses:
        '200':
          description: List of units
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnitItem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /activities:
    get:
      summary: List activities
      operationId: listActivities
      tags:
        - Activities
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: unitId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by unit ID
      responses:
        '200':
          description: List of activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /activities/{slug}:
    get:
      summary: Get activity detail
      operationId: getActivityDetail
      tags:
        - Activities
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Activity slug
      responses:
        '200':
          description: Activity detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ActivityDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'